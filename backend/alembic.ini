[alembic]
script_location = alembic
prepend_sys_path = .
# Split prepend_sys_path with the OS path separator instead of the legacy
# guess based on spaces, commas and colons. Without it Alembic emits a
# DeprecationWarning, which our strict warning policy turns into an error.
path_separator = os

# Migration file names are prefixed with a UTC timestamp so the directory
# listing is chronological and merge conflicts are obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# No sqlalchemy.url here, on purpose. The URL is read from validated Settings
# in alembic/env.py, so the database password lives in exactly one place and
# never in a file that is committed to Git.

[post_write_hooks]
# No hooks. Formatting a freshly generated migration is tempting, but every
# hook style ties alembic.ini to how the tool happens to be installed on one
# machine, and that breaks inside the container and in CI. A generated file is
# formatted with `ruff format .` like any other file, and CI already fails on
# unformatted code.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
